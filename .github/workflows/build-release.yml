name: Build New-Years QMOD

on:
  push:
    branches:
      - main
      - test/new-years-preview-results-fireworks
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Quest package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit source configuration and package metadata
        run: python3 scripts/audit-source.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip curl python3

      - name: Install QPM CLI
        env:
          QPM_VERSION: v1.5.12
        run: |
          curl -fsSL "https://github.com/QuestPackageManager/QPM.CLI/releases/download/${QPM_VERSION}/qpm-linux-x64.zip" -o "$RUNNER_TEMP/qpm.zip"
          mkdir -p "$RUNNER_TEMP/qpm"
          unzip -q "$RUNNER_TEMP/qpm.zip" -d "$RUNNER_TEMP/qpm"
          QPM_BIN="$(find "$RUNNER_TEMP/qpm" -type f -name qpm | head -n 1)"
          test -n "$QPM_BIN"
          chmod +x "$QPM_BIN"
          sudo install "$QPM_BIN" /usr/local/bin/qpm
          qpm --version

      - name: Resolve Android NDK
        run: qpm ndk resolve -d

      - name: Restore QPM dependencies
        run: qpm restore

      - name: Generate QMOD manifest
        run: qpm qmod manifest

      - name: Validate manifest assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("mod.json").read_text(encoding="utf-8"))
          if manifest.get("id") != "newyears":
              raise SystemExit("Unexpected mod id")
          if manifest.get("packageVersion") != "1.40.8_7379":
              raise SystemExit("Manifest no longer targets Beat Saber 1.40.8_7379")
          if manifest.get("modFiles") != ["libnewyears.so"]:
              raise SystemExit("Unexpected New-Years library declaration")
          if manifest.get("coverImage") != "NewYears-README.png":
              raise SystemExit("Incorrect New Years cover image for MBF")
          if not Path(manifest["coverImage"]).is_file():
              raise SystemExit("Cover image is missing")
          for entry in manifest.get("fileCopies", []):
              asset = Path("FileCopies") / Path(entry["name"]).name
              if not asset.is_file():
                  raise SystemExit(f"Missing fileCopies asset: {asset}")
          print("New-Years manifest and source assets validated.")
          PY

      - name: Configure Android build
        run: |
          NDK_TOOLCHAIN="$(find "$HOME/.local/share/QPM-RS/ndk" -path '*/build/cmake/android.toolchain.cmake' -print -quit)"
          test -n "$NDK_TOOLCHAIN"
          NDK_ROOT="${NDK_TOOLCHAIN%/build/cmake/android.toolchain.cmake}"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile New-Years mod
        run: |
          cmake --build build --parallel
          test -s build/libnewyears.so

      - name: Build and package QMOD
        run: |
          qpm qmod zip --import mod.json --skip_build
          test -s New-Years-Theme.qmod

      - name: Validate QMOD archive contents
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("New-Years-Theme.qmod") as archive:
              names = set(archive.namelist())
              if "mod.json" not in names:
                  raise SystemExit("QMOD is missing mod.json")
              manifest = json.loads(archive.read("mod.json"))
              if manifest.get("id") != "newyears":
                  raise SystemExit("Unexpected packaged mod id")
              if manifest.get("packageVersion") != "1.40.8_7379":
                  raise SystemExit("Packaged manifest no longer targets Beat Saber 1.40.8_7379")
              if "libnewyears.so" not in names:
                  raise SystemExit("QMOD is missing libnewyears.so")
              cover = manifest.get("coverImage")
              if cover != "NewYears-README.png":
                  raise SystemExit("Incorrect packaged cover image for MBF")
              if cover and cover not in names:
                  raise SystemExit(f"QMOD is missing cover image: {cover}")
              if manifest.get("fileCopies", []) != []:
                  raise SystemExit("New Years QMOD must not package third-party audio")
              if "Midnight_Synthwave_Tokyo.ogg" in names:
                  raise SystemExit("Unexpected bundled third-party soundtrack")
          allowed = {"mod.json", "libnewyears.so", cover}
          unexpected = sorted(names - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected QMOD entries: {unexpected}")
          for name in sorted(names):
              item = archive.getinfo(name)
              print(f"PACKAGE ENTRY {name}: raw={item.file_size} compressed={item.compress_size}")
          print("QMOD validated: Beat Saber 1.40.8, library, cover, no bundled third-party music.")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: New-Years-QMOD
          path: New-Years-Theme.qmod
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QMOD artifact
        uses: actions/download-artifact@v4
        with:
          name: New-Years-QMOD
          path: dist

      - name: Validate release tag against packaged manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          with zipfile.ZipFile("dist/New-Years-Theme.qmod") as archive:
              manifest = json.loads(archive.read("mod.json"))
          actual = manifest.get("version")
          if actual != expected:
              raise SystemExit(f"Tag {tag} does not match QMOD version {actual}")
          print(f"Release version validated: {actual}")
          PY

      - name: Create source archive
        run: git archive --format=zip --prefix=New-Years-Theme/ HEAD -o dist/New-Years-Theme-GitHub-Source.zip

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: New-Years Theme ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/New-Years-Theme.qmod
            dist/New-Years-Theme-GitHub-Source.zip

  refresh-v1-release:
    name: Refresh existing v1.0.0 release from tested main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Refresh tested New Years v1.0.0 release assets'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated QMOD
        uses: actions/download-artifact@v4
        with:
          name: New-Years-QMOD
          path: dist
      - name: Verify release and generate matching source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/New-Years-Theme.qmod
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("dist/New-Years-Theme.qmod") as z:
              m = json.loads(z.read("mod.json"))
              assert (m["id"], m["version"], m["coverImage"]) == ("newyears", "1.0.0", "NewYears-README.png")
          PY
          git archive --format=zip --prefix=New-Years-Theme/ HEAD -o dist/New-Years-Theme-GitHub-Source.zip
          unzip -tq dist/New-Years-Theme-GitHub-Source.zip
      - name: Update existing release files and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.0.0 dist/New-Years-Theme.qmod dist/New-Years-Theme-GitHub-Source.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" -f sha="$GITHUB_SHA" -F force=true
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | {name,size}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')" = "$GITHUB_SHA"
